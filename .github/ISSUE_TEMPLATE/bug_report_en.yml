name: Bug Report
description: Report a problem such as no audio or display issues
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Fill in what you can. Do not attach personal information or DAW project files.

  - type: input
    id: version
    attributes:
      label: DawAudioStreamer version
      placeholder: "e.g. 0.4.5"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your Windows version, DAW, audio interface, OBS / Discord versions, etc.
      placeholder: "e.g. Windows 11, Fender Studio Pro 8, 48 kHz"
    validations:
      required: true

  - type: dropdown
    id: destination
    attributes:
      label: Where the problem occurs
      options:
        - DAW / VST3
        - OBS
        - Discord
        - Install / Uninstall
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened
      description: Describe what you did just before the issue and the status shown in the VST if applicable.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots or logs are welcome — remove any personal information before attaching.

  - type: checkboxes
    id: privacy
    attributes:
      label: Confirmation
      options:
        - label: I have only included information I am comfortable making public
          required: true
