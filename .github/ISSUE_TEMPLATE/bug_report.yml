name: 不具合報告
description: 音が出ない、表示がおかしいなどの問題を報告します
title: "[不具合] "
body:
  - type: markdown
    attributes:
      value: |
        分かる範囲で大丈夫です。個人情報やDAWのプロジェクトファイルは添付しないでください。

  - type: input
    id: version
    attributes:
      label: DawAudioStreamerのバージョン
      placeholder: 例：0.4.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 使用環境
      description: Windows、DAW、オーディオインターフェース、OBS／Discordなどを書いてください。
      placeholder: 例：Windows 11、Studio One Pro 8、48 kHz
    validations:
      required: true

  - type: dropdown
    id: destination
    attributes:
      label: 問題が起きた場所
      options:
        - DAW／VST3
        - OBS
        - Discord
        - インストール／アンインストール
        - その他
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 起きたこと
      description: 直前に行った操作と、VSTに表示された状態があれば書いてください。
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 補足
      description: スクリーンショットやログがあれば、個人情報を除いて添付できます。

  - type: checkboxes
    id: privacy
    attributes:
      label: 確認
      options:
        - label: 公開してよい情報だけを記載しました
          required: true
