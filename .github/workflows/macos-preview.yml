name: macOS preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

concurrency:
  group: macos-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DAS_VERSION: "0.4.2-macos-preview.1"

jobs:
  build:
    name: macOS preview (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            preset: macos-preview-arm
            label: AppleSilicon
          - runner: macos-26-intel
            preset: macos-preview-intel
            label: Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Test Setup in an isolated temporary home
        run: |
          mkdir -p build/setup-tests
          xcrun swiftc -swift-version 5 installer/macos/SetupCore.swift tests/macos_setup_tests.swift -o build/setup-tests/test-setup
          build/setup-tests/test-setup
          xcrun swiftc -swift-version 5 -framework AppKit installer/macos/SetupCore.swift installer/macos/SetupApp.swift -o build/setup-tests/DASSetup

      - name: Install OBS Studio
        run: |
          brew install --cask obs
          test -d /Applications/OBS.app/Contents/Frameworks/libobs.framework
          lipo -archs /Applications/OBS.app/Contents/Frameworks/libobs.framework/libobs | grep -qw "$(uname -m)"

      - name: Configure
        run: |
          cmake --preset ${{ matrix.preset }}
          grep -Fx "DAS_DISPLAY_VERSION:STRING=${{ env.DAS_VERSION }}" build/${{ matrix.preset }}/CMakeCache.txt

      - name: Check OBS bundle metadata
        run: |
          cmake --build --preset ${{ matrix.preset }} --target das_obs_source --parallel 3
          plist=$(find build/${{ matrix.preset }}/plugins/obs-source -path '*/das-obs-source.plugin/Contents/Info.plist' -print -quit)
          test -f "$plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" | grep -Fx '0.4.2'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist" | grep -Fx '0.4.2'

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Stage bundles
        run: |
          cmake -E remove_directory build/macos-package-${{ matrix.label }}
          cmake --install build/${{ matrix.preset }} --config Release \
            --prefix build/macos-package-${{ matrix.label }}

      - name: Create preview package
        run: |
          cmake \
            -DDAS_SOURCE_DIR=${{ github.workspace }} \
            -DDAS_BINARY_DIR=${{ github.workspace }}/build/${{ matrix.preset }} \
            -DDAS_INSTALL_ROOT=${{ github.workspace }}/build/macos-package-${{ matrix.label }} \
            -DDAS_OUTPUT_DIR=${{ github.workspace }}/build/dist \
            -DDAS_VERSION=${{ env.DAS_VERSION }} \
            -DDAS_COMMIT=${{ github.sha }} \
            -DDAS_ARCH_LABEL=${{ matrix.label }} \
            -P cmake/CreateMacPreviewPackage.cmake
          package=build/dist/DawAudioStreamer-${{ env.DAS_VERSION }}-macOS-${{ matrix.label }}
          test -f "$package/README_はじめにお読みください.txt"
          app="$package/DawAudioStreamer Setup.app"
          payload="$app/Contents/Resources/payload"
          test -x "$app/Contents/MacOS/DASSetup"
          codesign --verify --deep --strict "$app"
          test -x "$payload/DAS Send.vst3/Contents/MacOS/DAS Send"
          test -x "$payload/DAS Send.component/Contents/MacOS/DAS Send"
          test -x "$payload/das-obs-source.plugin/Contents/MacOS/das-obs-source"
          for bundle in "$payload"/*; do
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$bundle/Contents/Info.plist" | grep -Fx '0.4.2'
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$bundle/Contents/Info.plist" | grep -Fx '0.4.2'
          done
          ditto -x -k "$package.zip" build/setup-archive-check
          cmp installer/macos/README-macOS.txt "build/setup-archive-check/$(basename "$package")/README_はじめにお読みください.txt"
          codesign --verify --deep --strict "build/setup-archive-check/$(basename "$package")/DawAudioStreamer Setup.app"
          build/setup-tests/test-setup "build/setup-archive-check/$(basename "$package")/DawAudioStreamer Setup.app/Contents/Resources/payload"

      - name: Create corresponding source archive
        if: matrix.label == 'AppleSilicon'
        run: |
          cmake \
            -DDAS_SOURCE_DIR=${{ github.workspace }} \
            -DDAS_BINARY_DIR=${{ github.workspace }}/build/${{ matrix.preset }} \
            -DDAS_VERSION=${{ env.DAS_VERSION }} \
            -DDAS_OUTPUT=${{ github.workspace }}/build/dist/DawAudioStreamer-${{ env.DAS_VERSION }}-source.zip \
            -P cmake/CreateSourcePackage.cmake

      - name: Upload preview
        uses: actions/upload-artifact@v6
        with:
          name: DawAudioStreamer-macOS-${{ matrix.label }}-${{ github.sha }}
          path: build/dist/*.zip
          if-no-files-found: error
