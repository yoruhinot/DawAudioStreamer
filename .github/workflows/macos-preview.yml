name: macOS preview

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  workflow_call:
    inputs:
      version:
        description: Version string used in the package name
        type: string
        required: false
        default: "0.4.1-macos-preview.1"

concurrency:
  group: macos-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: macOS preview (${{ matrix.label }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      DAS_VERSION: ${{ inputs.version || '0.4.1-macos-preview.1' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            preset: macos-preview-arm
            label: AppleSilicon
          - runner: macos-26-intel
            preset: macos-preview-intel
            label: Intel

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install OBS Studio
        run: |
          brew install --cask obs
          test -d /Applications/OBS.app/Contents/Frameworks/libobs.framework
          lipo -archs /Applications/OBS.app/Contents/Frameworks/libobs.framework/libobs | grep -qw "$(uname -m)"

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 3

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Stage bundles
        run: |
          cmake -E remove_directory build/macos-package-${{ matrix.label }}
          cmake --install build/${{ matrix.preset }} --config Release \
            --prefix build/macos-package-${{ matrix.label }}

      - name: Create preview package
        run: |
          cmake \
            -DDAS_SOURCE_DIR=${{ github.workspace }} \
            -DDAS_BINARY_DIR=${{ github.workspace }}/build/${{ matrix.preset }} \
            -DDAS_INSTALL_ROOT=${{ github.workspace }}/build/macos-package-${{ matrix.label }} \
            -DDAS_OUTPUT_DIR=${{ github.workspace }}/build/dist \
            -DDAS_VERSION=${{ env.DAS_VERSION }} \
            -DDAS_COMMIT=${{ github.sha }} \
            -DDAS_ARCH_LABEL=${{ matrix.label }} \
            -P cmake/CreateMacPreviewPackage.cmake
          package=build/dist/DawAudioStreamer-${{ env.DAS_VERSION }}-macOS-${{ matrix.label }}
          test -f "$package/README-macOS.txt"
          test -x "$package/Install.command"
          test -x "$package/Uninstall.command"
          test -x "$package/payload/DAS Send.vst3/Contents/MacOS/DAS Send"
          test -x "$package/payload/DAS Send.component/Contents/MacOS/DAS Send"
          test -x "$package/payload/das-obs-source.plugin/Contents/MacOS/das-obs-source"

      - name: Upload preview
        uses: actions/upload-artifact@v6
        with:
          name: DawAudioStreamer-macOS-${{ matrix.label }}-${{ github.sha }}
          path: build/dist/*.zip
          if-no-files-found: error
